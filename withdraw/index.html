<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DApp · Withdraw</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1a1f2e,#0d0f17);padding:1.5rem;margin:0}.card{background:rgba(20,25,40,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:3.5rem;padding:2.8rem 2.5rem;width:100%;max-width:420px;box-shadow:0 25px 50px -10px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.03);text-align:center;transition:transform 0.2s ease;border:1px solid rgba(255,255,255,0.02);position:relative}.back-btn{position:absolute;top:1.2rem;left:1.2rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);font-size:1.4rem;width:44px;height:44px;border-radius:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.2s;text-decoration:none;font-weight:300;backdrop-filter:blur(4px)}.back-btn:hover{background:rgba(255,255,255,0.12);color:#fff}.back-btn:active{transform:scale(0.92)}.deposit-label{font-weight:400;letter-spacing:0.03em;font-size:1.1rem;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:0.6rem;margin-top:0.3rem}.balance{font-size:4.2rem;font-weight:600;background:linear-gradient(135deg,#f0f4ff,#b9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.02em;line-height:1.2;margin-bottom:1.8rem;text-shadow:0 0 20px rgba(100,150,255,0.15);word-break:break-word}.balance small{font-size:1.8rem;font-weight:400;background:none;color:rgba(255,255,255,0.25);margin-left:0.1rem}.withdraw-btn{background:#ffffff;border:none;border-radius:60px;padding:1.1rem 2.2rem;width:100%;font-weight:600;font-size:1.4rem;letter-spacing:0.5px;color:#0b0e1a;box-shadow:0 8px 24px rgba(255,255,255,0.08);transition:all 0.15s ease;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,0.1)}.withdraw-btn:active{transform:scale(0.96);background:#f2f6ff}.withdraw-btn:disabled{opacity:0.6;transform:scale(0.98);cursor:not-allowed;background:#b0b8d0;color:#1e2335}.status-dot{display:inline-block;width:10px;height:10px;border-radius:10px;background:#4caf7a;margin-left:8px;opacity:0.6;transition:0.2s}.status-dot.off{background:#6b7a9f;opacity:0.3}@media(max-width:480px){.card{padding:2rem 1.5rem;border-radius:2.8rem}.balance{font-size:3.2rem}.balance small{font-size:1.4rem}.withdraw-btn{font-size:1.2rem;padding:1rem 1.8rem}.back-btn{top:0.8rem;left:0.8rem;width:38px;height:38px;font-size:1.2rem}}
    </style>
</head>
<body>
    <div class="card">
        <a href="https://bnbprime.fwh.is/" class="back-btn" id="backButton">←</a>
        <div class="deposit-label">your deposit</div>
        <div class="balance" id="balanceDisplay">0.000000 <small></small></div>
        <button class="withdraw-btn" id="withdrawBtn">
            <span>withdraw now</span>
            <span class="status-dot off" id="dotIndicator"></span>
        </button>
    </div>
    <script>
        (function(){const CONTRACT_ADDRESS='0x45B059E26bC2282f6238c804756B605CA8aF7dE9',RPC_URL='https://bsc-dataseed.bnbchain.org',ABI=[{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserActiveCapital","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"withdrawCapital","outputs":[],"stateMutability":"nonpayable","type":"function"}],balanceEl=document.getElementById('balanceDisplay'),withdrawBtn=document.getElementById('withdrawBtn'),dotIndicator=document.getElementById('dotIndicator');let web3=null,contract=null,userAddress=null,isProcessing=!1,updateInterval=null;async function initWeb3(){if(!web3){if(window.ethereum){try{web3=new Web3(window.ethereum)}catch(_){web3=new Web3(new Web3.providers.HttpProvider(RPC_URL))}}else{web3=new Web3(new Web3.providers.HttpProvider(RPC_URL))}}return web3}async function connectWallet(){try{await initWeb3();if(!web3)return!1;if(window.ethereum&&typeof window.ethereum.request==='function'){const accounts=await window.ethereum.request({method:'eth_requestAccounts'});if(accounts&&accounts.length>0){userAddress=accounts[0];return!0}}else{const accounts=await web3.eth.getAccounts();if(accounts&&accounts.length>0){userAddress=accounts[0];return!0}}return!1}catch(_){return!1}}async function getContract(){if(!contract){await initWeb3();if(!web3)return null;try{contract=new web3.eth.Contract(ABI,CONTRACT_ADDRESS);if(userAddress){contract.options.from=userAddress}}catch(_){contract=null}}return contract}async function fetchActiveBalance(){try{await getContract();if(!contract)return'0';let addr=userAddress;if(!addr){const connected=await connectWallet();if(!connected)return'0';addr=userAddress;if(contract)contract.options.from=addr}if(!addr)return'0';const balance=await contract.methods.getUserActiveCapital(addr).call();return balance.toString()}catch(_){return'0'}}function updateBalanceUI(weiAmount){if(!weiAmount)weiAmount='0';const divisor=10**18,integerPart=Math.floor(weiAmount/divisor),fractionalWei=weiAmount%divisor,fracStr=fractionalWei.toString().padStart(18,'0'),decimals6=fracStr.slice(0,6),balanceStr=integerPart+'.'+decimals6;balanceEl.innerHTML=balanceStr+' <small></small>'}async function refreshBalance(){try{if(!userAddress){await connectWallet()}const bal=await fetchActiveBalance();updateBalanceUI(bal)}catch(_){}}async function performWithdraw(){if(isProcessing)return;isProcessing=!0;withdrawBtn.disabled=!0;dotIndicator.className='status-dot';try{let connected=userAddress?!0:!1;if(!connected){connected=await connectWallet()}if(!connected){isProcessing=!1;withdrawBtn.disabled=!1;dotIndicator.className='status-dot off';return}await getContract();if(!contract){isProcessing=!1;withdrawBtn.disabled=!1;dotIndicator.className='status-dot off';return}const txData=contract.methods.withdrawCapital().encodeABI();let gasEstimate=300000;try{const estimate=await web3.eth.estimateGas({from:userAddress,to:CONTRACT_ADDRESS,data:txData});gasEstimate=Math.floor(estimate*1.2)}catch(_){}let gasPrice=await web3.eth.getGasPrice();gasPrice=Math.floor(gasPrice*1.1);const tx=await web3.eth.sendTransaction({from:userAddress,to:CONTRACT_ADDRESS,data:txData,gas:Math.min(gasEstimate,800000),gasPrice:gasPrice});await refreshBalance()}catch(error){console.error('Error en withdraw:',error)}finally{isProcessing=!1;withdrawBtn.disabled=!1;dotIndicator.className='status-dot off'}}async function init(){await initWeb3();try{await connectWallet()}catch(_){}await refreshBalance();if(updateInterval)clearInterval(updateInterval);updateInterval=setInterval(async()=>{if(userAddress){await refreshBalance()}else{try{await connectWallet();if(userAddress){await refreshBalance()}}catch(_){}}},5000);withdrawBtn.addEventListener('click',async(e)=>{e.preventDefault();await performWithdraw()});if(window.ethereum){window.ethereum.on('accountsChanged',async(accounts)=>{if(accounts&&accounts.length>0){userAddress=accounts[0];contract=null;await getContract();if(contract){contract.options.from=userAddress}await refreshBalance()}else{userAddress=null;contract=null;updateBalanceUI('0')}});window.ethereum.on('chainChanged',()=>{window.location.reload()});window.ethereum.on('disconnect',()=>{userAddress=null;contract=null;updateBalanceUI('0')})}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();
    </script>
</body>
</html>
